<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>テスト</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<style>
html, body {
	margin: 0;
	padding: 0;
	width: 100%;
	height: 100%;
}

.container {
	width: 100%;
	height: 100%;
	max-width: 100%;
	max-height: 100%;
	display: block;
	background-color: aquamarine;
}
</style>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.min.js"></script>
</head>

<body>
<svg class="container" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" viewBox="0 0 1920 1080">
	<foreignObject width="1920" height="1080" requiredExtensions="http://www.w3.org/1999/xhtml">
		<main id="app">
			<video id="video" :src="videoURL" style="position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;"></video>
			<input type="file" @change="selectVideo" style="position: absolute; left: 0; top: 1000px; width: 640px; height: 80px; opacity: 0.75;">
			<input type="text" v-model="playlist" style="position: absolute; left: 640px; top: 1000px; width: 960px; height: 80px; opacity: 0.75;">
			<input type="button" value="Play" @click="play" style="position: absolute; left: 1600px; top: 1000px; width: 320px; height: 80px; opacity: 0.75;">
		</main>
	</foreignObject>
</svg>

<script>
const { createApp } = Vue

const fps = 30
const segments = [
	{ start: 0, end: 836 },
	{ start: 837, end: 1745 },
	{ start: 1746, end: 2195 },
	{ start: 2196, end: 2555 },
	{ start: 2556, end: 3005 },
	{ start: 3006, end: 3629 },

	{ start: 3690, end: 4402 },
	{ start: 4403, end: 4852 },
	{ start: 4853, end: 6354 },
	{ start: 6355, end: 6804 },
	{ start: 6805, end: 7254 },
	{ start: 7255, end: 7889 },

	{ start: 7950, end: 8107 },
	{ start: 8108, end: 8797 },
]
// 2:05-4:21.6
// 「はじめから」「戻る」「次へ」「スキップ」
async function playSegments(segments) {
	for (const segment of segments) {
		video.currentTime = segment.start / fps

		await new Promise(resolve => {
			video.addEventListener("seeked", resolve, { once: true })
		})

		await video.play()

		await new Promise(resolve => {
			function check() {
				if (video.currentTime >= segment.end / fps) {
					video.pause()
					resolve()
				} else {
					requestAnimationFrame(check)
				}
			}
			check()
		})
	}
}

createApp({
	data() {
		return {
			videoURL: null,
			playlist: "",
		}
	},

	methods: {
		selectVideo(event) {
			const file = event.target.files[0]
			if (file == null) return
			this.videoURL = URL.createObjectURL(file)
		},

		play() {
			playSegments(this.playlist.split(",").map(v => segments[Number(v)]))
		},
	}
}).mount("#app")
</script>
</body>
</html>
